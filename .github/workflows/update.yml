name: 更新價格

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "sources.json"

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取價格並產生網頁
        run: python pricewatch.py

      - name: 提交更新
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "update prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
